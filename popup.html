<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luna Translate</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="popup">
  <header class="bar">
    <strong>Luna Translate</strong>
    <span class="provider-pill" id="providerPill"></span>
    <button type="button" class="icon-btn" id="openOptions" data-i18n-label="popupSettings">⚙</button>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" class="tab is-active" data-mode="translate" aria-selected="true" data-i18n="modeTranslate"></button>
    <button type="button" role="tab" class="tab" data-mode="polish" aria-selected="false" data-i18n="modePolish"></button>
  </div>

  <textarea id="input" maxlength="8000" data-i18n-placeholder="popupPlaceholder" data-i18n-label="popupInputLabel"></textarea>
  <div class="row">
    <span class="muted" id="counter">0 / 8000</span>
    <button type="button" class="primary" id="run"></button>
  </div>

  <div id="notice" class="notice hidden" role="alert"></div>
  <div id="output" class="output" aria-live="polite"></div>

  <script src="lib/render.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
