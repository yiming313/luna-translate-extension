<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luna Translate</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="popup">
  <header class="bar">
    <strong>Luna Translate</strong>
    <span class="provider-pill" id="providerPill"></span>
    <button type="button" class="icon-btn" id="openOptions" data-i18n-label="popupSettings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2" /><circle cx="9" cy="17" r="2" />
      </svg>
    </button>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" class="tab is-active" data-mode="translate" aria-selected="true" data-i18n="modeTranslate"></button>
    <button type="button" role="tab" class="tab" data-mode="polish" aria-selected="false" data-i18n="modePolish"></button>
  </div>

  <textarea id="input" maxlength="8000" data-i18n-placeholder="popupPlaceholder" data-i18n-label="popupInputLabel"></textarea>
  <div class="row">
    <span class="muted" id="counter">0 / 8000</span>
    <button type="button" class="primary" id="run"><span id="runLabel"></span> <kbd class="kbd" id="runKey" aria-hidden="true"></kbd></button>
  </div>

  <div id="notice" class="notice hidden" role="alert"></div>
  <div id="output" class="output" aria-live="polite"></div>

  <script src="lib/render.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
