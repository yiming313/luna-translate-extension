<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luna Translate</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="options">
  <main>
    <h1 data-i18n="optPageTitle"></h1>
    <p class="muted" data-i18n="optIntro"></p>

    <section class="card">
      <h2 data-i18n="optProvider"></h2>
      <div class="providers" id="providers" role="radiogroup" data-i18n-label="optProvider"></div>

      <label class="field">
        <span><span data-i18n="optApiKey"></span> <a id="keyLink" href="#" target="_blank" rel="noopener noreferrer" data-i18n="optGetKey"></a></span>
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false" />
      </label>
      <div class="field">
        <span data-i18n="optModel"></span>
        <div class="model-row">
          <select id="modelSelect" data-i18n-label="optModel"></select>
          <button type="button" id="refreshModels" data-i18n="optRefreshModels"></button>
        </div>
        <input id="model" class="hidden" autocomplete="off" spellcheck="false" data-i18n-placeholder="optModelCustomPlaceholder" />
      </div>
      <label class="field">
        <span data-i18n="optBaseUrl"></span>
        <input id="baseUrl" type="url" autocomplete="off" spellcheck="false" data-i18n-placeholder="optBaseUrlPlaceholder" />
        <small class="muted" data-i18n="optBaseUrlHelp"></small>
      </label>
      <div class="row">
        <button type="button" id="test" data-i18n="optTest"></button>
        <button type="button" class="primary" id="save" data-i18n="optSave"></button>
        <span id="status" class="muted" role="status" aria-live="polite"></span>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="optSectionLang"></h2>
      <label class="field">
        <span data-i18n="optTarget"></span>
        <select id="targetLanguage"></select>
      </label>
      <label class="field">
        <span data-i18n="optPolishLang"></span>
        <select id="polishLanguage"></select>
      </label>
      <label class="field">
        <span data-i18n="optTranslatePrompt"></span>
        <textarea id="translatePrompt" rows="5"></textarea>
      </label>
      <label class="field">
        <span data-i18n="optPolishPrompt"></span>
        <textarea id="polishPrompt" rows="8"></textarea>
      </label>
    </section>

    <section class="card">
      <h2 data-i18n="optPrivacy"></h2>
      <p class="muted" data-i18n="optPrivacyText"></p>
      <div class="row"><button type="button" id="clearData" data-i18n="optClear"></button></div>
    </section>

    <section class="card">
      <h2 data-i18n="optUsage"></h2>
      <ul class="muted">
        <li data-i18n="optUsage1"></li>
        <li data-i18n="optUsage2"></li>
        <li data-i18n="optUsage3"></li>
      </ul>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
